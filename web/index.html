<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Check how out of date a GitHub repo's AI coding-tool instruction files are." />
    <meta name="theme-color" content="#0e1013" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>PromptDebt Scanner</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="offline" class="banner" role="status" hidden>
      You're offline. Scanning is unavailable until you reconnect.
    </div>

    <header class="topbar">
      <button id="back" class="btn btn-quiet" type="button" aria-label="Back" hidden>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" /></svg>
      </button>
      <h1 id="title" tabindex="-1">PromptDebt Scanner</h1>
    </header>

    <main id="main" class="main"></main>

    <nav class="tabbar" aria-label="Main">
      <a href="#/" data-tab="scan">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="9" r="5.5" /><path d="m13 13 4 4" /></svg>Scan
      </a>
      <a href="#/watchlist" data-tab="watchlist">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h8" /></svg>Watchlist
      </a>
      <a href="#/triage" data-tab="triage">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="3.5" width="13" height="13" /><path d="m7 10 2 2 4-4" /></svg>Triage
      </a>
      <a href="#/settings" data-tab="settings">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="2.5" /><path d="M10 2.5v2.5M10 15v2.5M2.5 10H5M15 10h2.5M4.7 4.7l1.8 1.8M13.5 13.5l1.8 1.8M4.7 15.3l1.8-1.8M13.5 6.5l1.8-1.8" /></svg>Settings
      </a>
    </nav>

    <div id="toasts" class="toasts" aria-live="polite"></div>
    <dialog id="dialog" class="dialog"></dialog>

    <noscript><p class="main">PromptDebt Scanner needs JavaScript to run.</p></noscript>
  </body>
</html>
